# OpenTelemetry Collector Configuration
# This collector acts as an intermediary between your services and the observability backends
# Benefits:
# - Vendor independence: Switch backends (Tempo, Jaeger, Loki) without changing service code
# - Centralized configuration: All export logic in one place
# - Processing capabilities: Add sampling, filtering, enrichment as needed
# - Multiple backends: Send traces/logs to multiple destinations simultaneously

receivers:
  # OTLP receiver - accepts traces AND logs from your services
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor - batches spans/logs for efficient export
  batch:
    timeout: 1s
    send_batch_size: 1024
  
  # Memory limiter - prevents OOM by dropping data if memory usage is too high
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  
  # Resource processor - adds/modifies resource attributes
  resource:
    attributes:
      - key: loki.resource.labels
        value: service.name, service.namespace
        action: insert

exporters:
  # Tempo exporter - for traces
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  
  # Loki exporter - for logs via OTLP HTTP
  # Loki 3.0+ supports native OTLP ingestion at /otlp/v1/logs endpoint
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  
  # Example: Add Jaeger exporter (commented out)
  # jaeger:
  #   endpoint: jaeger:14250
  #   tls:
  #     insecure: true
  
  # Example: Add Zipkin exporter (commented out)
  # zipkin:
  #   endpoint: http://zipkin:9411/api/v2/spans
  
  # Debug exporter - useful for debugging (replaces deprecated logging exporter)
  debug:
    verbosity: normal

service:
  pipelines:
    # Traces pipeline: Services -> OTel Collector -> Tempo
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    
    # Logs pipeline: Services -> OTel Collector -> Loki
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki, debug]
  
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
