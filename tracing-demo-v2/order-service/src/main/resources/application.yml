spring:
  application:
    name: order-service
  rabbitmq:
    host: localhost
    port: 5672
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

server:
  port: 8081

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  # Spring Boot 4 OpenTelemetry configuration
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: true
          transport: http
          # Use the base endpoint - the exporter will append the correct path
          endpoint: http://localhost:4318
    metrics:
      export:
        otlp:
          enabled: true
          transport: http
          endpoint: http://localhost:4318
          # Increase step duration to reduce export frequency and errors
          step: 60s
    logging:
      export:
        otlp:
          enabled: false
          # Disable log export as we're using file-based logging

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# Logging configuration is in logback-spring.xml for JSON format with trace IDs
