spring:
  application:
    name: order-service
  rabbitmq:
    host: localhost
    port: 5672
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

server:
  port: 8081

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  # Spring Boot 4 OpenTelemetry configuration
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: true
          transport: grpc
          endpoint: http://localhost:4317
    # OTLP Logging export - correct path for Spring Boot 4
    logging:
      export:
        otlp:
          enabled: true
          endpoint: http://localhost:4318/v1/logs
    metrics:
      export:
        otlp:
          enabled: false
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# Logging configuration is in logback-spring.xml for JSON format with trace IDs
