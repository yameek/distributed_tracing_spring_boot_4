spring:
  application:
    name: order-service
  rabbitmq:
    host: localhost
    port: 5672
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

server:
  port: 8081

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      enabled: true
      correlation:
        enabled: true
        fields:
          - traceId
          - spanId
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  
# MDC keys for tracing
micrometer:
  tracing:
    propagation:
      type: W3C

# Logging configuration is in logback-spring.xml for JSON format with trace IDs
