spring:
  application:
    name: cqrs-service
  
  rabbitmq:
    host: localhost
    port: 5672
  
  datasource:
    url: jdbc:postgresql://localhost:5433/cqrs_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8084

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  # Spring Boot 4 OpenTelemetry configuration
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: true
          transport: grpc
          endpoint: http://localhost:4317
    metrics:
      export:
        otlp:
          enabled: false
    logging:
      export:
        otlp:
          enabled: false
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.example.tracing.cqrs: INFO
    org.springframework.amqp: WARN
    org.hibernate: WARN

# Logging configuration is in logback-spring.xml for JSON format with trace IDs
