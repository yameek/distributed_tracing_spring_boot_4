spring:
  application:
    name: inventory-service
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        missing-queues-fatal: false
        auto-startup: true

server:
  port: 8082

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

logging:
  pattern:
    correlation:
      enabled: true

# Logging configuration is in logback-spring.xml for JSON format with trace IDs
