spring:
  application:
    name: inventory-service
  rabbitmq:
    host: localhost
    port: 5672

server:
  port: 8082

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      enabled: true
      correlation:
        enabled: true
        fields:
          - traceId
          - spanId
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  
# MDC keys for tracing
micrometer:
  tracing:
    propagation:
      type: W3C

# Logging configuration is in logback-spring.xml for JSON format with trace IDs
