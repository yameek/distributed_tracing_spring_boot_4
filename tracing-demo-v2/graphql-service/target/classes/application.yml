spring:
  application:
    name: graphql-service
  graphql:
    graphiql:
      enabled: true

server:
  port: 8080

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # Sample 100% of requests for demo
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

logging:
  pattern:
    correlation:
      enabled: true

# Logging configuration is in logback-spring.xml for JSON format with trace IDs
