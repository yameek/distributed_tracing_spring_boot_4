dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Spring Boot 4 OpenTelemetry Starter - replaces manual tracing config
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    
    // Logging - OpenTelemetry Logback appender for OTLP log export
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.24.0-alpha'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    
    // Testing
    testImplementation 'org.springframework.graphql:spring-graphql-test'
}

bootJar {
    archiveBaseName = 'graphql-service'
    archiveVersion = '0.0.1-SNAPSHOT'
}
