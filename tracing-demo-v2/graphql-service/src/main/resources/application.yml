spring:
  application:
    name: graphql-service
  rabbitmq:
    host: localhost
    port: 5672
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

server:
  port: 8080

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  # Spring Boot 4 OpenTelemetry configuration
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: true
          transport: http
          # Use the base endpoint - the exporter will append the correct path
          endpoint: http://localhost:4318
    metrics:
      export:
        otlp:
          enabled: true
          transport: http
          endpoint: http://localhost:4318
          # Increase step duration to reduce export frequency and errors
          step: 60s
    logging:
      export:
        otlp:
          enabled: false
          # Disable log export as we're using file-based logging

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# Logging configuration is in logback-spring.xml for JSON format with trace IDs
