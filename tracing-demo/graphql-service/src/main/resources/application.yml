spring:
  application:
    name: graphql-service
  graphql:
    graphiql:
      enabled: true

management:
  tracing:
    sampling:
      probability: 1.0 # Sample 100% of requests for demo
  otlp:
    tracing:
      endpoint: http://tempo:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
